# Frozen market-data snapshot manifest.
#
# The CSVs in this directory are the ONE audited snapshot, dated 2026-07-24.
# DATA_SOURCES.md carries the human-readable provenance; this file carries the
# machine-checked contract: observation/retrieval dates, publisher, primary
# URL, raw field meaning and units, transformation formula, licence status,
# public/constructed/illustrative classification, known limitations, and a
# sha256 checksum per dataset. Tests verify the manifest against the packaged
# CSV bytes, so a dataset and its provenance cannot drift apart silently.
snapshot_date = "2026-07-24"
description = "Frozen market-data snapshot: SEK government curve inputs, USD OIS and forecast curve inputs, ECB euro-area spot curve and Svensson parameters, FRED Treasury CMT history, and an illustrative ATM swaption volatility grid."

