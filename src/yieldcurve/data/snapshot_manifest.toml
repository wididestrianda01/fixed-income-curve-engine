observation_date = "2026-07-24"
retrieval_date = "2026-07-24"
publisher = "Sveriges Riksbank"
primary_url = "https://api.riksbank.se/swea/v1/Observations/<seriesId>/<from>/<to>"
classification = "public"
licence = "Riksbank open data: free reuse with attribution ('Enter source, Sveriges Riksbank and date')"
transformation = "Percentage quotes divided by 100 to decimals; maturity dates are the quoted series observation dates"
columns = ["tenor", "maturity_date", "rate"]
units = { tenor = "tenor label (1M, 3M, 6M)", maturity_date = "ISO 8601 date", rate = "decimal yield (0.01933 = 1.933%)" }
limitations = "Frozen 2026-07-24; the 12M bill series was discontinued in 2010 and is absent"
sha256 = "9659dc1673062e03b224c97d70103b631ede192a38612de05b9d15b4bc686c2f"

