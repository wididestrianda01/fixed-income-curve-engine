[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yieldcurve"
# Task 18: the public description is the controlling objective verbatim (spec
# section "Objective"). No author or project-URL fields are declared: the
# repository URL is not publicly resolvable, so metadata ships no placeholders.
description = "An educational fixed-income analytics project built around a frozen market-data snapshot. It demonstrates curve construction, selected instrument valuation, interest-rate risk diagnostics, and a one-factor Hull-White example. It is not a trading, accounting-valuation, regulatory-reporting, or production risk system."
keywords = ["fixed-income", "yield-curve", "interest-rate-risk", "hull-white", "educational"]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.13"
# HYGIENE-07: one version source. hatchling reads __version__ from
# src/yieldcurve/__init__.py, so pyproject.toml and the package cannot drift.
dynamic = ["version"]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "pandas>=2.2",
]

[project.optional-dependencies]
# TQ-12: dev tooling, the app runtime, and the notebook runtime are separate
# extras so each installs independently (CI installs them with uv from the
# lockfile; the app extra carries no developer tooling).
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "hypothesis>=6.112",
    "QuantLib>=1.36",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs>=2.2",
    "pre-commit>=3.8",
    "nbmake>=1.5",
]
notebooks = [
    "jupyter>=1.1",
    "matplotlib>=3.9",
]
app = [
    "streamlit>=1.38",
    "plotly>=5.24",
]

[tool.hatch.version]
path = "src/yieldcurve/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/yieldcurve"]
# DOC-10/HYGIENE-01: the wheel must carry every runtime resource under
# src/yieldcurve: the snapshot CSVs and manifest in yieldcurve/data/,
# scenarios.toml in yieldcurve/risk/, the py.typed marker, and the model
# limitations doc (Task 13 review: controller-ruled INCLUDE). Wheel ``include``
# only matches inside the packaged tree, so the doc rides in via
# ``force-include`` (source -> wheel-relative path).
include = ["src/yieldcurve/**"]
force-include = { "docs/hull-white-limitations.md" = "docs/hull-white-limitations.md" }

[tool.hatch.build.targets.sdist]
# HYGIENE-01/04/05, SEC-03: an explicit include policy for the source
# distribution, plus a denylist of local agent state, caches, coverage
# output, worktrees, and developer tooling. tests/test_build.py enforces the
# denylist against the built artifact.
include = [
    "src/**",
    "app/**",
    "tests/**",
    "scripts/**",
    "notebooks/**",
    "docs/**",
    ".github/**",
    "*.md",
    "LICENSE",
    "pyproject.toml",
    "uv.lock",
    ".gitattributes",
    ".gitignore",
]
exclude = [
    "docs/superpowers/**",
    ".superpowers/**",
    ".context/**",
    "PLAN.md",
    "**/__pycache__/**",
    "**/*.py[cod]",
    "**/*.egg-info/**",
    "**/.mypy_cache/**",
    "**/.ruff_cache/**",
    "**/.pytest_cache/**",
    "**/.hypothesis/**",
    "**/.ipynb_checkpoints/**",
    "**/.claude-flow/**",
    "**/.swarm/**",
    "**/.worktrees/**",
    "**/.codegraph/**",
    "**/graphify-out/**",
    "**/.venv/**",
    "**/.vscode/**",
    "**/.idea/**",
    "**/.serena/**",
    "**/.DS_Store",
    "**/.coverage",
    "**/coverage.xml",
    "**/htmlcov/**",
    "**/dist/**",
    "**/dist-review/**",
    "**/build/**",
    "**/data/raw/**",
    "**/data/processed/**",
    "**/data/cache/**",
    "**/data/snapshots/**",
    "**/*.parquet",
    "**/*.pkl",
    "**/*.joblib",
    "**/ruvector.db",
    "**/.env",
    "**/.env.*",
    "**/*.pem",
    "**/kaggle.json",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "NPY", "PD"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_ignores = false
files = ["src", "tests", "app.py"]

[[tool.mypy.overrides]]
module = ["QuantLib.*", "scipy.*", "streamlit.*", "plotly.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pytest"
ignore_missing_imports = true

# TQ-10: coverage arguments belong only to the package-test command, so the
# global addopts carry no --cov flags. The 90% floor is declared here and
# enforced when the package-test command passes --cov=yieldcurve (pytest-cov
# reads fail_under from this configuration).
[tool.coverage.run]
source = ["yieldcurve"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "slow: Monte Carlo convergence and other long-running tests",
]
