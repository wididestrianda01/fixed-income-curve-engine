[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yieldcurve"
version = "0.1.0"
description = "Multi-curve fixed-income term structure construction, pricing and interest-rate risk"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "pandas>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "hypothesis>=6.112",
    "QuantLib>=1.36",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs>=2.2",
    "pre-commit>=3.8",
    "nbmake>=1.5",
]
notebooks = [
    "jupyter>=1.1",
    "matplotlib>=3.9",
]
app = [
    "streamlit>=1.38",
    "matplotlib>=3.9",
    "plotly>=5.24",
]

[tool.hatch.build.targets.wheel]
packages = ["src/yieldcurve"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "NPY", "PD"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_ignores = false
files = ["src", "tests", "app.py"]

[[tool.mypy.overrides]]
module = ["QuantLib.*", "scipy.*", "streamlit.*", "plotly.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pytest"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=yieldcurve --cov-report=term-missing --cov-fail-under=90 --strict-markers"
markers = [
    "slow: Monte Carlo convergence and other long-running tests",
]
