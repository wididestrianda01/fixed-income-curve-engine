repos:
  # SEC-04: executable hooks are pinned to a full commit SHA, not a tag ref;
  # rev is the commit behind the v0.16.0 tag of astral-sh/ruff-pre-commit.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: cb8c523fd4835aba42af70f4cad5568db4df0b6c  # v0.16.0
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  # mypy runs in the project environment rather than an isolated one: --strict
  # needs to resolve curveengine itself, and a mirrors-mypy hook can only be fed
  # third-party stubs. Settings (strict, files, per-module overrides) all come
  # from pyproject.toml, so the hook and a bare `mypy` agree by construction.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
