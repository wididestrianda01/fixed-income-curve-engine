# A stylised Swedish banking book. Every bond is a real Riksgälden benchmark taken from
# src/yieldcurve/data/riksgalden_gov_bonds.csv — real ISIN, real coupon, real
# maturity. The notionals are invented: they are chosen so the six EU 2024/856
# supervisory shock scenarios (see src/yieldcurve/risk/scenarios.toml) produce visibly
# different illustrative Delta EVE, which is the point of the exhibit. This is not
# anyone's actual balance sheet.
#
# tier1_capital is likewise invented and is disclosed as such. It exists only to give
# the illustrative outlier comparison something to divide by; it is not regulatory
# capital.

